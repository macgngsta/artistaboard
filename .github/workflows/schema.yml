name: schema-drift

on:
  push:
    branches: [main]
  pull_request:

# The typed web client (web/src/api/schema.d.ts) is generated from the backend
# OpenAPI schema. It's regenerated manually (`npm run gen:api`), so a backend API
# change can silently leave the client stale. This job regenerates it from the
# app's OpenAPI (no running server needed) and fails if it differs from what's
# committed.
jobs:
  schema-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv python install 3.13
      - run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web

      - name: Regenerate typed client from backend OpenAPI
        run: |
          uv run python scripts/dump_openapi.py > openapi.json
          cd web && npx openapi-typescript ../openapi.json -o src/api/schema.d.ts

      - name: Fail on drift
        run: |
          if ! git diff --quiet web/src/api/schema.d.ts; then
            echo "::error::web/src/api/schema.d.ts is out of sync with the backend OpenAPI — run 'npm run gen:api' (backend running) and commit the result."
            git --no-pager diff web/src/api/schema.d.ts
            exit 1
          fi
