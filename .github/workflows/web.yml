name: web

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  # The typed client (web/src/api/schema.d.ts) is generated by hand from a running
  # backend, so it silently drifts when the API changes without a regen. Regenerate
  # against a fresh backend and fail if the committed file differs.
  api-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv python install 3.13
      - run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Start backend
        # Launch via the venv python, not `uv run`: a lingering `uv` process holds the
        # uv cache lock, which hangs setup-uv's post-job cache prune for 300s.
        run: |
          .venv/bin/python -m artistaboard serve &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/openapi.json >/dev/null && break
            sleep 1
          done
      - name: Regenerate client
        run: npm run gen:api
        working-directory: web
      - name: Fail on drift
        run: |
          if ! git diff --exit-code web/src/api/schema.d.ts; then
            echo "::error::web/src/api/schema.d.ts is stale — run 'npm run gen:api' in web/ and commit the result."
            exit 1
          fi
      - name: Stop backend
        if: always()
        run: kill "$(cat /tmp/backend.pid)" 2>/dev/null || true
