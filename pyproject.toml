[project]
name = "artistaboard"
version = "0.1.0"
description = "Drive a Vestaboard with composable scenes, JSON glyph fonts, and scheduled jobs"
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.10",
    "httpx>=0.27",
    "pydantic-settings>=2.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "email-validator>=2.0",
    "cryptography>=42.0",
    "alembic>=1.13",
]

[project.scripts]
artistaboard = "artistaboard.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artistaboard"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py313"
line-length = 120
# Autogenerated Alembic revisions — don't lint/format machine output.
extend-exclude = ["src/artistaboard/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.isort]
known-first-party = ["artistaboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
