[project]
name = "artistaboard"
version = "0.1.0"
description = "Drive a Vestaboard with composable scenes, JSON glyph fonts, and scheduled jobs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.10",
    "httpx>=0.27",
    "pydantic-settings>=2.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "email-validator>=2.0",
    "cryptography>=42.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "procrastinate>=3",
]

[project.scripts]
artistaboard = "artistaboard.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artistaboard"]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py313"
line-length = 120
# Autogenerated Alembic revisions — don't lint/format machine output.
extend-exclude = ["src/artistaboard/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.isort]
known-first-party = ["artistaboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
# The shipping package only — tests idiomatically deref Optional session.get() results,
# which is noise here; pytest covers them at runtime.
include = ["src"]
# Autogenerated Alembic revisions mirror SQLAlchemy's own loose typing — not ours.
exclude = ["src/artistaboard/migrations/versions", "**/__pycache__", ".venv"]
typeCheckingMode = "basic"
# SQLModel/SQLAlchemy's declarative ORM defeats static typing in ways that are noise,
# not bugs: ColumnElement operators (.in_, .desc, or_), order_by/column positions,
# __tablename__ declared_attr, and attribute access on mapped classes. Silence those
# categories so the gate flags real problems (undefined names, possibly-unbound vars,
# unresolved imports) without an ORM-typing rewrite.
reportAttributeAccessIssue = "none"
reportArgumentType = "none"
reportCallIssue = "none"
reportAssignmentType = "none"
reportIndexIssue = "none"
