# mise is the front door for this project: tool management + dev tasks.
# Bare task names work (e.g. `mise test`); `mise run <task>` is the explicit form.

[tools]
python = "3.13"
uv = "latest"

[tasks.ci]
# Reproduce GitHub CI locally: macgngsta/* Actions never run (billing), so local-ci.sh runs this on a
# PR head and posts the `local-ci` status ci-watch's merge gate reads. Mirrors ci.yml (ruff, pyright,
# pytest) and web.yml's `web` job (node typecheck/lint/test/build). ci.yml auto-fixes-and-commits
# formatting; from a throwaway worktree we can't push, so we assert cleanliness with `ruff format
# --check` instead. Deliberately NOT here (see PR body): web.yml's `api-drift` job (needs a live
# backend + client regen), docker tasks and deploy.
description = "Run CI locally (ci.yml + web.yml web job): uv sync, ruff, pyright, pytest, web npm"
# node only for this task (web.yml uses node 22); the repo's tool set stays python-only.
tools = { node = "22" }
run = [
    "uv sync --locked",
    "uv run ruff check .",
    "uv run ruff format --check .",
    "uv run pyright",
    "uv run pytest -q",
    "cd web && npm ci && npm run typecheck && npm run lint && npm run test && npm run build",
]

[tasks.install]
description = "Install dependencies (incl. dev) into .venv"
run = "uv sync --dev"

[tasks.run]
description = "Run the scheduler daemon for the active job"
run = "uv run python -m artistaboard run"

[tasks.preview]
description = "Render a job to the terminal without touching the board: mise preview clock"
run = "uv run python -m artistaboard preview"

[tasks.paint]
description = "Render a job once and send it to the board: mise paint clock"
run = "uv run python -m artistaboard paint"

[tasks.serve]
description = "Run the web app (api) with uvicorn on http://127.0.0.1:8000"
run = "uv run python -m artistaboard serve"

[tasks.test]
description = "Run the test suite"
run = "uv run pytest -q"

[tasks.lint]
description = "Lint with ruff (check + format check)"
run = ["uv run ruff check .", "uv run ruff format --check ."]

[tasks.lint-fix]
description = "Auto-fix lint + format"
run = ["uv run ruff check --fix .", "uv run ruff format ."]

[tasks.docker-build]
description = "Build the Docker image"
run = "docker build -t artistaboard ."

[tasks.docker-up]
description = "Start the daemon via docker compose"
depends = ["docker-build"]
run = "docker compose up -d"

[tasks.docker-down]
description = "Stop the docker compose stack"
run = "docker compose down"

[tasks.migrate]
description = "Apply database migrations (alembic upgrade head)"
run = "uv run alembic upgrade head"
